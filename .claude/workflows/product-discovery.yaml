# DEPRECATED: Replaced by create-product-definition.yaml
# The new workflow decomposes the MVP Brief into 3 steps, adds Business Architect
# as a 4th perspective, creates a proper Design Specification skill, adds a
# final proof-read step, and fixes the input document dependencies.
#
# NOTE: This workflow is still referenced by Elixir code:
#   - lib/flow_studio_web/live/product_live/product_brief.ex (line ~425)
#   - lib/flow_studio_web/live/product_live/show.ex (line ~57)
# Update these references to "create-product-definition" before deleting this file.

name: product-discovery
description: >
  DEPRECATED: Replaced by create-product-definition.yaml.
  Kept until Elixir code references are updated.
version: "1.0.0"

input:
  product_slug:
    type: string
    required: true
    description: URL-friendly identifier for the product
  product_name:
    type: string
    required: true
    description: Human-readable name of the product
  instruction:
    type: string
    required: false
    description: >
      Optional user instruction passed to every step. Use for focus areas,
      constraints, preferences, or feedback from a previous iteration.
      Examples: "Focus on the European market", "Simplify the pricing model",
      "The architecture should support multi-tenancy from day one"
  tech_stack:
    type: string
    required: false
    default: "elixir"
    description: >
      Tech stack for the MVP. Determines which agent handles architecture.
      Default: "elixir" (Elixir/Phoenix/Ash). Override for other stacks.

steps:

  - name: set-discovery-status
    type: run_script
    description: Transition product to discovery phase
    config:
      module: FlowStudio.Workflows.Scripts.CreateProduct
      function: set_discovery_state

  - name: discover
    type: ask_ai
    description: Product Trio conducts discovery and defines the MVP Brief
    config:
      agent: product-maestro
      prompt: |
        /understanding-mvp {{input.product_slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        ## Context

        Use the Product Brief research files in docs/product-brief/ to conduct
        structured discovery rounds. The Business Architect should contribute
        hypotheses during discovery — include a "Hypotheses to Test" section
        in the MVP Brief with the top 3 hypotheses (value, business, usability).

        ## Iteration Awareness

        Check if docs/product-definition/1-mvp-brief.md already exists.
        If it does, this is a refinement iteration:
        - Read the existing document first
        - Read the user instruction carefully — it likely contains feedback
        - Refine and improve the document, don't start from scratch
        - Preserve what works, update what needs to change
        - Note what changed and why in a brief "## Revision Notes" section at the end

        If it doesn't exist, create it fresh from discovery.

        ## Output

        Save to: docs/product-definition/1-mvp-brief.md
    output:
      path: context.discovery
    postconditions:
      - type: file_exists
        path: "docs/product-definition/1-mvp-brief.md"

  - name: envision
    type: ask_ai
    description: Create the product vision document
    config:
      agent: product-maestro
      prompt: |
        /creating-product-vision {{input.product_slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read the MVP Brief at docs/product-definition/1-mvp-brief.md and the
        input files in docs/product-brief/ to create a product vision.

        ## Iteration Awareness

        Check if docs/product-definition/2-product-vision.md already exists.
        If it does, this is a refinement iteration:
        - Read the existing document first
        - Refine based on the user instruction and any changes in the MVP Brief
        - Preserve what works, update what needs to change
        - Note what changed and why in a brief "## Revision Notes" section at the end

        If it doesn't exist, create it fresh.

        ## Output

        Save to: docs/product-definition/2-product-vision.md
    output:
      path: context.vision
    postconditions:
      - type: file_exists
        path: "docs/product-definition/2-product-vision.md"

  - name: strategize
    type: ask_ai
    description: Create the product strategy document
    config:
      agent: product-maestro
      prompt: |
        /creating-product-strategy {{input.product_slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read the MVP Brief at docs/product-definition/1-mvp-brief.md and the
        Vision at docs/product-definition/2-product-vision.md to create the
        product strategy. This document defines how we win: target market,
        go-to-market, competitive positioning, business model, and roadmap.

        ## Iteration Awareness

        Check if docs/product-definition/3-product-strategy.md already exists.
        If it does, this is a refinement iteration:
        - Read the existing document first
        - Refine based on the user instruction and any changes in upstream docs
        - Preserve what works, update what needs to change
        - Note what changed and why in a brief "## Revision Notes" section at the end

        If it doesn't exist, create it fresh.

        ## Output

        Save to: docs/product-definition/3-product-strategy.md
    output:
      path: context.strategy
    postconditions:
      - type: file_exists
        path: "docs/product-definition/3-product-strategy.md"

  - name: design-ux
    type: ask_ai
    description: Design the app UI structure and user flows
    config:
      agent: design-shaper
      prompt: |
        /designing-app-ui {{input.product_slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read the MVP Brief, Vision, and Strategy to design the app UI.

        Input documents:
        - docs/product-definition/1-mvp-brief.md
        - docs/product-definition/2-product-vision.md
        - docs/product-definition/3-product-strategy.md

        If you identify gaps or contradictions in upstream documents,
        note them in a '## Upstream Feedback' section. Do not silently work around gaps.

        ## Iteration Awareness

        Check if docs/product-definition/4-design-specification.md already exists.
        If it does, this is a refinement iteration:
        - Read the existing document first
        - Refine based on the user instruction and any changes in upstream docs
        - Preserve what works, update what needs to change
        - Note what changed and why in a brief "## Revision Notes" section at the end

        If it doesn't exist, create it fresh.

        ## Output

        Save to: docs/product-definition/4-design-specification.md
    output:
      path: context.design
    postconditions:
      - type: file_exists
        path: "docs/product-definition/4-design-specification.md"

  - name: design-visual
    type: ask_ai
    description: Create the visual design specification
    config:
      agent: visual-designer
      prompt: |
        /creating-visual-design {{input.product_slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Create the visual design specification based on the MVP Brief, Vision,
        and Design Specification.

        Input documents:
        - docs/product-definition/1-mvp-brief.md
        - docs/product-definition/2-product-vision.md
        - docs/product-definition/4-design-specification.md

        If you identify gaps or contradictions in upstream documents,
        note them in a '## Upstream Feedback' section. Do not silently work around gaps.

        ## Iteration Awareness

        Check if docs/product-definition/5-visual-specification.md already exists.
        If it does, this is a refinement iteration:
        - Read the existing document first
        - Refine based on the user instruction and any changes in upstream docs
        - Preserve what works, update what needs to change
        - Note what changed and why in a brief "## Revision Notes" section at the end

        If it doesn't exist, create it fresh.

        ## Output

        Save to: docs/product-definition/5-visual-specification.md
    output:
      path: context.visual
    postconditions:
      - type: file_exists
        path: "docs/product-definition/5-visual-specification.md"

  - name: content
    type: ask_ai
    description: Create the content specification
    config:
      agent: content-writer
      prompt: |
        /creating-content-spec {{input.product_slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Create the content specification based on the MVP Brief, Vision,
        Strategy, and Design Specification.

        Input documents:
        - docs/product-definition/1-mvp-brief.md
        - docs/product-definition/2-product-vision.md
        - docs/product-definition/3-product-strategy.md
        - docs/product-definition/4-design-specification.md

        If you identify gaps or contradictions in upstream documents,
        note them in a '## Upstream Feedback' section. Do not silently work around gaps.

        ## Iteration Awareness

        Check if docs/product-definition/6-content-specification.md already exists.
        If it does, this is a refinement iteration:
        - Read the existing document first
        - Refine based on the user instruction and any changes in upstream docs
        - Preserve what works, update what needs to change
        - Note what changed and why in a brief "## Revision Notes" section at the end

        If it doesn't exist, create it fresh.

        ## Output

        Save to: docs/product-definition/6-content-specification.md
    output:
      path: context.content
    postconditions:
      - type: file_exists
        path: "docs/product-definition/6-content-specification.md"

  - name: architect
    type: if
    description: Create architecture document with stack-appropriate agent
    config:
      condition:
        field: input.tech_stack
        operator: equals
        value: elixir
      then:
        name: architect-elixir
        type: ask_ai
        description: Create architecture using Elixir/Ash expertise
        config:
          agent: elixir-alchemist
          prompt: |
            /creating-architecture {{input.product_slug}}

            Product name: {{input.product_name}}
            User instruction: {{input.instruction}}

            Create the architecture document for this Elixir/Phoenix/Ash MVP.

            Input documents (read in this order):
            - docs/product-definition/1-mvp-brief.md
            - docs/product-definition/2-product-vision.md
            - docs/product-definition/4-design-specification.md

            Do NOT read visual or content specs — those are build-time concerns.

            If you identify gaps or contradictions in upstream documents,
            note them in a '## Upstream Feedback' section. Do not silently work around gaps.

            ## Iteration Awareness

            Check if docs/product-definition/7-architecture-blueprint.md already exists.
            If it does, this is a refinement iteration:
            - Read the existing document first
            - Refine based on the user instruction and any changes in upstream docs
            - Preserve what works, update what needs to change
            - Note what changed and why in a brief "## Revision Notes" section at the end

            If it doesn't exist, create it fresh.

            ## Output

            Save to: docs/product-definition/7-architecture-blueprint.md
      else:
        name: architect-generic
        type: ask_ai
        description: Create architecture using general engineering expertise
        config:
          agent: tech-smith
          prompt: |
            /creating-architecture {{input.product_slug}}

            Product name: {{input.product_name}}
            User instruction: {{input.instruction}}

            Create the architecture document for this MVP.

            Input documents (read in this order):
            - docs/product-definition/1-mvp-brief.md
            - docs/product-definition/2-product-vision.md
            - docs/product-definition/4-design-specification.md

            Do NOT read visual or content specs — those are build-time concerns.

            If you identify gaps or contradictions in upstream documents,
            note them in a '## Upstream Feedback' section. Do not silently work around gaps.

            ## Iteration Awareness

            Check if docs/product-definition/7-architecture-blueprint.md already exists.
            If it does, this is a refinement iteration:
            - Read the existing document first
            - Refine based on the user instruction and any changes in upstream docs
            - Preserve what works, update what needs to change
            - Note what changed and why in a brief "## Revision Notes" section at the end

            If it doesn't exist, create it fresh.

            ## Output

            Save to: docs/product-definition/7-architecture-blueprint.md
    output:
      path: context.architecture
    postconditions:
      - type: file_exists
        path: "docs/product-definition/7-architecture-blueprint.md"
