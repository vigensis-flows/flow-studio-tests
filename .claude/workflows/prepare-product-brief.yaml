name: prepare-product-brief
description: >
  Preparing the workspace and the first version of the product brief.
  We'll guide you through it in the next steps.
version: "1.0.0"
navigate_to: product-brief

input:
  product_name:
    type: string
    required: true
    description: "Name of the product"
  description:
    type: string
    required: false
    description: "Short description of the product idea"
  org_id:
    type: string
    required: true

display:
  label: "{{input.product_name}}"
  sections:
    - header: "Product Brief"
      content: output.summary

steps:

  - name: prepare-workspace
    type: run_script
    config:
      module: FlowStudio.Workflows.Scripts.CreateProduct
      function: prepare_workspace
    output:
      path: context.workspace

  - name: existing-materials
    type: ask-user
    description: Tell us if you have any existing materials
    config:
      prompt: |
        Your workspace is almost ready.
        Do you have any existing materials you'd like us to work with?

        This could be anything — a pitch deck, market research, a business plan, or anything else.

        We'll use them as the foundation for the Product Brief.
      fields:
        existing_materials:
          type: yes_no
          required: true
          yes_label: "Yes, I have materials to upload"
          no_label: "No, continue with the product brief"
          description: "Do you already have something prepared for this product?"
    output:
      path: context.user_context

  - name: determine-next-steps
    type: if
    description: The next step depends on whether you have materials to upload or not
    config:
      condition:
        field: context.user_context.existing_materials
        operator: equals
        value: true
      then:
        name: let-user-upload
        type: run_script
        config:
          module: FlowStudio.Workflows.Scripts.CreateProduct
          function: set_pre_discovery_state
      else:
        name: draft-product-brief
        type: run_workflow
        description: Draft the initial product brief
        config:
          workflow: draft-product-brief
          input:
            product_name: "{{input.product_name}}"
            description: "{{input.description}}"
          inherit_context: true
    output:
      path: context.result
