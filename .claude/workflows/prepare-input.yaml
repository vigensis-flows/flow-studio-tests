# DEPRECATED: Input quality review is now handled by the Product Trio during discovery.
# The separate review step added latency without user value.
# See docs/product/product-lifecycle.md for the new product lifecycle.
#
name: prepare-input
description: Review and enrich product input files, determine tech stack
version: "1.0.0"

input:
  product_slug:
    type: string
    required: true
    description: URL-friendly identifier for the product
  product_name:
    type: string
    required: true
    description: Human-readable name of the product
  instruction:
    type: string
    required: false
    description: Optional user instruction (may specify tech stack or other guidance)

steps:
  - name: review-and-enrich
    type: ask_ai
    description: Review input files for completeness, fill gaps, determine tech stack
    config:
      agent: research-analyst
      prompt: |
        /reviewing-input {{input.product_slug}}

        Product name: {{input.product_name}}

        User instruction (if any): {{input.instruction}}

        Review the input files in input/ for completeness.
        Fill any gaps with targeted research.
        Determine the tech stack based on the user instruction or default to Elixir/Phoenix/Ash.
        Save the review to docs/products/{{input.product_slug}}/input-review.md.
    output:
      path: context.input_review
    postconditions:
      - type: file_exists
        path: "docs/products/{{input.product_slug}}/input-review.md"
