name: create-product-definition
description: >
  The Product Team creates the initial Product Definition: vision, strategy,
  and a detailed plan for the MVP.
  Vision (where we're going) → Strategy (how we win) → MVP (the first step).
version: "3.0.0"

input:
  product_name:
    type: string
    required: true
    description: Product Name
  instruction:
    type: string
    required: false
    description: >
      You can provide additional instructions if you have.
      For example: "Focus on solo founders", "The pricing was too high", 
      "Simplify the onboarding"

steps:

  - name: synthesize-research
    type: ask_ai
    description: >
      The Product Team analyzes the Product Brief
    config:
      agent: product-maestro
      prompt: |
        /synthesizing-product-research {{input.product_name | slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read all documents in docs/product-brief/ and synthesize them into a
        focused working document. Apply all four lenses: product, design,
        business, and engineering.

        ## Output

        Save to: docs/product-definition/working/research-synthesis.md
    output:
      path: context.research_synthesis
    postconditions:
      - type: file_exists
        path: "docs/product-definition/working/research-synthesis.md"

  - name: define-product-vision
    type: ask_ai
    description: >
      The Product Maestro defines the vision: where this product
      is going in 3-5 years, why it matters, and what makes it different
    config:
      agent: product-maestro
      prompt: |
        /creating-product-vision {{input.product_name | slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read the research synthesis:
        - docs/product-definition/working/research-synthesis.md

        Also read the original opportunity research for the full picture:
        - docs/product-brief/1-problem-and-opportunity.md

        Create the product vision informed by the full opportunity landscape
        — all segments, all differentiation vectors, all competitive reality.
        This is the north star that strategy and MVP flow from.

        Include Mission, Product Personality, and Principles sections.

        ## Output

        Save to: docs/product-definition/1-product-vision.md
    output:
      path: context.vision
    postconditions:
      - type: file_exists
        path: "docs/product-definition/1-product-vision.md"

  - name: define-product-strategy
    type: ask_ai
    description: >
      The Business Architect defines how to win;
      competitive positioning, business model, go-to-market and roadmap
    config:
      agent: business-architect
      prompt: |
        /creating-product-strategy {{input.product_name | slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read the Vision and research synthesis:
        - docs/product-definition/1-product-vision.md
        - docs/product-definition/working/research-synthesis.md

        Also read the original competitive research for positioning depth:
        - docs/product-brief/3-competitive-landscape.md
        - docs/product-brief/4-product-intelligence.md

        Strategy is how we win — offensive, not defensive. Know yourself,
        know your competition, determine how to win. Position against
        competitors, not retreating from them.

        Include an Architecture Implications subsection in the Business
        Model section — the architect needs this downstream.

        The Roadmap uses Now/Next/Later horizons.

        ## Output

        Save to: docs/product-definition/2-product-strategy.md
    output:
      path: context.strategy
    postconditions:
      - type: file_exists
        path: "docs/product-definition/2-product-strategy.md"

  - name: explore-mvp-bets
    type: ask_ai
    description: >
      The Venture Builder identifies the riskiest assumptions and designs
      3-5 ways to test them — cheapest first
    config:
      agent: venture-builder
      prompt: |
        /exploring-mvp-options {{input.product_name | slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read the Vision, Strategy, and research synthesis:
        - docs/product-definition/1-product-vision.md
        - docs/product-definition/2-product-strategy.md
        - docs/product-definition/working/research-synthesis.md

        Explore 3-5 MVP bets — possible first steps within the strategy.
        Each bet is a different entry approach into the same strategy
        toward the same vision. Scariest hypothesis first, cheapest test,
        kill criteria before emotions get involved.

        ## Output

        Save to: docs/product-definition/working/mvp-bets.md
    output:
      path: context.mvp_bets
    postconditions:
      - type: file_exists
        path: "docs/product-definition/working/mvp-bets.md"

  - name: write-mvp-brief
    type: ask_ai
    description: >
      The Product Maestro proposes the scope for the MVP
    config:
      agent: product-maestro
      prompt: |
        /writing-mvp-brief {{input.product_name | slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read the Vision, Strategy, and MVP bets:
        - docs/product-definition/1-product-vision.md
        - docs/product-definition/2-product-strategy.md
        - docs/product-definition/working/mvp-bets.md

        If a product context file exists (.claude/context/product-context.md),
        read it to understand what the product already has. Existing
        capabilities should be included by default — they have zero
        incremental build cost.

        Write the MVP Brief — the detailed plan for the first step toward
        the vision, within the strategy, based on the founder's direction.

        ## Output

        Save to: docs/product-definition/3-mvp-brief.md
    output:
      path: context.mvp_brief
    postconditions:
      - type: file_exists
        path: "docs/product-definition/3-mvp-brief.md"

  - name: design-user-experience
    type: ask_ai
    description: >
      The Designer defines how the product works — user flows,
      screen inventory, interaction patterns, and the First Moment
    config:
      agent: design-shaper
      prompt: |
        /creating-design-specification {{input.product_name | slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read the Vision, Strategy, and MVP Brief:
        - docs/product-definition/1-product-vision.md
        - docs/product-definition/2-product-strategy.md
        - docs/product-definition/3-mvp-brief.md

        Also read original user research — specific frustration patterns
        and jobs-to-be-done are direct design inputs:
        - docs/product-brief/5-user-voice.md
        - docs/product-brief/2-users-and-needs.md

        Create a comprehensive design specification covering:
        conceptual model, user flows, screen inventory, information
        architecture, interaction patterns, state design for every
        screen, a detailed First Moment, and observable behaviors.

        This document is the backbone — Visual, Content, and Architecture
        all build from it.

        ## Output

        Save to: docs/product-definition/4-design-specification.md
    output:
      path: context.design
    postconditions:
      - type: file_exists
        path: "docs/product-definition/4-design-specification.md"

  - name: design-visuals
    type: ask_ai
    description: >
      The Visual Designer defines how the product looks — theme,
      colors, typography, component styling, and screen compositions
    config:
      agent: visual-designer
      prompt: |
        /creating-visual-design {{input.product_name | slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Create the visual design specification based on the Vision
        and Design Specification.

        Input documents:
        - docs/product-definition/1-product-vision.md
        - docs/product-definition/4-design-specification.md

        Translate the product personality from the Vision and the screen
        inventory from the Design Spec into a concrete visual system.

        ## Output

        Save to: docs/product-definition/5-visual-specification.md
    output:
      path: context.visual
    postconditions:
      - type: file_exists
        path: "docs/product-definition/5-visual-specification.md"

  - name: create-content
    type: ask_ai
    description: >
      The Content Writer defines what the product says — voice, tone,
      value proposition, microcopy, error messages, and key page content
    config:
      agent: content-writer
      prompt: |
        /creating-content-spec {{input.product_name | slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Create the content specification based on the Vision, Strategy,
        MVP Brief, and Design Specification.

        Input documents:
        - docs/product-definition/1-product-vision.md
        - docs/product-definition/2-product-strategy.md
        - docs/product-definition/3-mvp-brief.md
        - docs/product-definition/4-design-specification.md

        Also read user voice for the language real users use:
        - docs/product-brief/5-user-voice.md

        Write all copy — not descriptions of copy. Every label, every
        empty state, every error message should be actual text a user
        would see.

        ## Output

        Save to: docs/product-definition/6-content-specification.md
    output:
      path: context.content
    postconditions:
      - type: file_exists
        path: "docs/product-definition/6-content-specification.md"

  - name: determine-tech-stack
    type: ask_ai
    description: >
      The Tech Lead evaluates product requirements and recommends the
      optimal technology stack — a reasoned decision, not a default
    config:
      agent: tech-smith
      prompt: |
        /determining-tech-stack {{input.product_name | slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read the MVP Brief, Strategy, and Design Specification:
        - docs/product-definition/3-mvp-brief.md
        - docs/product-definition/2-product-strategy.md
        - docs/product-definition/4-design-specification.md

        Recommend the technology stack and specialist architect.

        ## Output

        Save to: docs/product-definition/working/tech-stack-decision.md
    output:
      path: context.tech_stack
    postconditions:
      - type: file_exists
        path: "docs/product-definition/working/tech-stack-decision.md"

  - name: define-architecture
    type: ask_ai
    description: >
      The specialist architect defines how to build it — domain model,
      data design, and technical decisions that affect multiple components
    config:
      agent: "{{context.tech_stack.agent}}"
      prompt: |
        /defining-architecture {{input.product_name | slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read the tech stack decision first:
        - docs/product-definition/working/tech-stack-decision.md

        Then read the product definition documents (in this order):
        - docs/product-definition/1-product-vision.md
        - docs/product-definition/2-product-strategy.md
        - docs/product-definition/3-mvp-brief.md
        - docs/product-definition/4-design-specification.md

        Also read the reference product analysis for competitive architecture:
        - docs/product-brief/4-product-intelligence.md

        Pay special attention to the Strategy's Architecture Implications
        section (multi-tenancy, feature gating, metering, compute budget)
        and the Design Spec's Observable Behaviors section.

        Do NOT read visual or content specs — those are build-time concerns.

        ## Output

        Save to: docs/product-definition/7-architecture-blueprint.md
    output:
      path: context.architecture
    postconditions:
      - type: file_exists
        path: "docs/product-definition/7-architecture-blueprint.md"

  - name: review-product-definition
    type: ask_ai
    description: >
      Final proof-read of all documents as a package — fixes minor
      inconsistencies and flags anything substantive for review
    config:
      agent: product-maestro
      prompt: |
        /reviewing-product-definition {{input.product_name | slug}}

        Product name: {{input.product_name}}

        Read all 7 product definition documents as a package:
        - docs/product-definition/1-product-vision.md
        - docs/product-definition/2-product-strategy.md
        - docs/product-definition/3-mvp-brief.md
        - docs/product-definition/4-design-specification.md
        - docs/product-definition/5-visual-specification.md
        - docs/product-definition/6-content-specification.md
        - docs/product-definition/7-architecture-blueprint.md

        Also read the research synthesis to cross-check claims against evidence:
        - docs/product-definition/working/research-synthesis.md

        Fix minor textual issues (repetition, terminology inconsistencies,
        language tightening) directly in the documents.

        Produce a brief coherence report flagging anything substantive
        that needs human attention.

        ## Output

        Save report to: docs/product-definition/working/coherence-report.md
    output:
      path: context.review
    postconditions:
      - type: file_exists
        path: "docs/product-definition/working/coherence-report.md"

  - name: pressure-test-product-definition
    type: ask_ai
    description: >
      The Venture Critic stress-tests the product definition — challenging
      the bet, the business model, the scope, and the hypotheses before
      committing to building
    config:
      agent: venture-critic
      prompt: |
        /pressure-testing-product-definition {{input.product_name | slug}}

        Product name: {{input.product_name}}

        Read the reality check from the Product Brief phase:
        - docs/product-brief/7-reality-check.md

        Then read all 7 product definition documents:
        - docs/product-definition/1-product-vision.md
        - docs/product-definition/2-product-strategy.md
        - docs/product-definition/3-mvp-brief.md
        - docs/product-definition/4-design-specification.md
        - docs/product-definition/5-visual-specification.md
        - docs/product-definition/6-content-specification.md
        - docs/product-definition/7-architecture-blueprint.md

        Conduct independent research — competitor moves, pricing evidence,
        failure precedents. Do not just critique from the armchair.

        Apply the six pressure points: the bet, scope honesty, model
        survivability, hypothesis theater, coherence under stress, and
        time-to-signal.

        Produce a clear signal: PROCEED, ITERATE, or RECONSIDER.

        ## Output

        Save to: docs/product-definition/8-pressure-test.md
    output:
      path: context.pressure_test
    postconditions:
      - type: file_exists
        path: "docs/product-definition/8-pressure-test.md"

  - name: save-product-definition
    type: run_script
    config:
      module: FlowStudio.Workflows.Scripts.CreateProduct
      function: commit_and_push_definition

  - name: activate-product-definition
    type: run_script
    config:
      module: FlowStudio.Workflows.Scripts.CreateProduct
      function: set_discovery_state
