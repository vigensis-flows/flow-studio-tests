name: create-report
description: >
  Generic report packaging workflow. Takes a title, subtitle, and markdown
  content, then produces an executive summary, saves both to files, and
  optionally renders a branded PDF. Reusable by any workflow that produces
  report content.
version: "1.0.0"

input:
  title:
    type: string
    required: true
    description: "Report title"
  subtitle:
    type: string
    required: true
    description: "Report subtitle"
  content:
    type: string
    required: true
    description: "Full report body as markdown"
  folder_path:
    type: string
    required: true
    description: "Directory to save report files into"
  report_filename:
    type: string
    default: "report"
    description: "Base filename without extension"
  create_pdf:
    type: boolean
    default: false
    description: Generate a branded PDF version

steps:
  - name: write-summary
    type: ask-ai
    description: Generate a crisp 3-sentence executive summary from the report content
    config:
      prompt: |
        You are given the content of a report titled "{{input.title}}".

        Report content:
        {{input.content}}

        Write an executive summary — exactly 3 sentences:
        1. What was found (the landscape)
        2. What stands out (the key recommendation or insight)
        3. What to do next (the action)

        Be direct and specific. No filler. Every word earns its place.

        Return as JSON: { summary: "the 3 sentences as a single string" }
    output:
      path: context.summary
      format: json
      required:
        - summary

  - name: save-files
    type: run_script
    description: Save the report and executive summary as markdown files
    config:
      module: FlowStudio.Workflows.Scripts.ReportWriter
      function: save_report_files
    output:
      path: context.files

  - name: generate-pdf
    type: if
    description: Render a branded PDF if requested
    config:
      condition:
        field: input.create_pdf
        operator: equals
        value: true
      then:
        name: render-pdf
        type: run_script
        config:
          module: FlowStudio.Workflows.Scripts.ReportWriter
          function: render_pdf
      else:
        name: skip-pdf
        type: run_script
        config:
          module: FlowStudio.Workflows.Scripts.ReportWriter
          function: skip_pdf
    output:
      path: context.pdf_result
