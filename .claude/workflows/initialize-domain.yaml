name: initialize-domain
description: VIA initializes a new expertise domain to be used in product development
version: "5.1.0"

input:
  domain_id:
    type: string
    required: true
  domain_name:
    type: string
    required: true
    description: The name of the domain
  role_name:
    type: string
    required: false
    description: "The name of the expert role (e.g., 'Product Manager')"
  ai_expert_name:
    type: string
    required: false
    description: "The name of the AI Agent (e.g., 'Product Maestro')"

display:
  label: "{{input.domain_name}}"

navigate_to: ""

on_complete:
  event: FlowStudio.Expertise.Events.DomainInitialized
  payload:
    domain_id: "{{input.domain_id}}"
    guide_path: "docs/guides/{{input.domain_name | slug}}/guide.md"
    overview_path: "docs/guides/{{input.domain_name | slug}}/README.md"
    role_description_path: "docs/process/roles/{{input.role_name | slug}}.md"
    agent_prompt_path: ".claude/agents/{{input.ai_expert_name | slug}}.md"

on_failure:
  event: FlowStudio.Expertise.Events.DomainInitializationFailed
  payload:
    domain_id: "{{input.domain_id}}"
    error: "{{error.message}}"

steps:
  - name: create-domain-guide
    type: ask_ai
    description: Our Intelligence Architect creates the domain guide
    config:
      agent: intelligence-architect
      prompt: |
        /creating-domain-guides {{input.domain_name | slug}}
    output:
      path: context.guide_thinking
    postconditions:
      - type: file_exists
        path: "docs/guides/{{input.domain_name | slug}}/guide.md"

  - name: create-overview-and-role
    type: do
    description: Then the domain overview and role description
    config:
      strategy: all
      on_error: fail_fast
      steps:
        - name: create-overview
          type: ask_ai
          description: Creates the domain overview
          config:
            agent: intelligence-architect
            prompt: |
              /creating-domain-overviews {{input.domain_name | slug}}
          output:
            path: context.overview_thinking
          postconditions:
            - type: file_exists
              path: "docs/guides/{{input.domain_name | slug}}/README.md"

        - name: create-role-description
          type: ask_ai
          description: Creates the expert role description
          config:
            agent: intelligence-architect
            prompt: |
              /creating-role-descriptions {{input.domain_name | slug}} {{input.role_name | slug}}
          output:
            path: context.role_description_thinking
          postconditions:
            - type: file_exists
              path: "docs/process/roles/{{input.role_name | slug}}.md"

  - name: create-agent-prompt
    type: ask_ai
    description: Based on that, the Prompt Mentor creates the AI Expert
    config:
      agent: prompt-mentor
      prompt: |
        Use the /creating-agent-prompts skill to create the agent system prompt for this domain expert.

        Arguments: {{input.domain_name | slug}} {{input.role_name | slug}} {{input.ai_expert_name | slug}}

        The agent name is already decided — use "{{input.ai_expert_name | slug}}" directly (do NOT propose alternatives or ask the user).

        IMPORTANT: Do NOT attempt to write the file to disk. Instead, return the complete agent prompt
        file content (including YAML frontmatter) as a JSON object with a single key "content".

        Example response format:
        ```json
        {"agent_prompt": "---\nname: venture-critic\nsummary: ...\n---\n\n<role>\n..."}
        ```
    output:
      path: context.agent_prompt
      format: json
      required:
        - agent_prompt

  - name: save-agent-prompt
    type: run_script
    config:
      module: FlowStudio.Workflows.Scripts.FileWriter
      function: save_agent_prompt
    postconditions:
      - type: file_exists
        path: ".claude/agents/{{input.ai_expert_name | slug}}.md"
