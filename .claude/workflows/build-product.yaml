name: build-product
description: >
  Builds working software from the product definition. Unified workflow:
  always analyzes what exists vs what's needed, creates a plan, builds,
  and verifies. In dev mode, also runs Docker Compose for a live demo.
  In prod mode, writes code and pushes to GitHub only.
version: "1.1.0"

input:
  product_name:
    type: string
    required: true
    description: Human-readable name of the product
  instruction:
    type: string
    required: false
    description: >
      Optional user instruction for focus areas or feedback.
      Examples: "Focus on the onboarding flow first", "The auth was broken,
      fix it", "Simplify the dashboard — too many elements"

steps:

  - name: read-tech-stack
    type: ask_ai
    description: >
      Reads the existing tech stack decision to determine which specialist
      agent should handle the build step
    config:
      agent: tech-smith
      prompt: |
        Read the tech stack decision document:
        - docs/product-definition/working/tech-stack-decision.md

        If the file exists, extract the agent and stack from the JSON block
        at the bottom of the document. Your response MUST end with exactly
        this JSON block:

        ```json
        {
          "stack": "[stack name from the document]",
          "agent": "[agent name from the document — elixir-alchemist or tech-smith]"
        }
        ```

        If the file does not exist, default to:
        ```json
        {
          "stack": "Elixir + Phoenix + Ash + PostgreSQL",
          "agent": "elixir-alchemist"
        }
        ```

        CRITICAL: The agent value must be exactly "elixir-alchemist" or "tech-smith".
        No other values are valid.
    output:
      path: context.tech_stack

  - name: analyze-and-plan
    type: ask_ai
    description: >
      The Tech Smith analyzes the product definition against the current
      codebase and creates a build plan — what to build, in what order
    config:
      agent: tech-smith
      prompt: |
        /creating-build-plans {{input.product_name | slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read all product definition documents:
        - docs/product-definition/3-mvp-brief.md (scope — PRIMARY)
        - docs/product-definition/7-architecture-blueprint.md (tech stack, structure)
        - docs/product-definition/4-design-specification.md (UX, flows, screens)
        - docs/product-definition/5-visual-specification.md (look and feel)
        - docs/product-definition/6-content-specification.md (copy, messaging)

        Also read the tech stack decision for stack-specific guidance:
        - docs/product-definition/working/tech-stack-decision.md

        Inspect the current codebase:
        - Is there existing application code? (check for mix.exs, package.json, etc.)
        - If code exists: what's implemented vs what the definition requires?
        - What's missing, what's changed, what needs updating?

        Create a build plan that describes what needs to happen to make the
        codebase match the current product definition. This works the same
        whether it's a first build or an incremental update — the plan
        captures the gap.

        Include docker-compose.yml generation as a plan item.

        ## Output

        Save to: docs/build-plan.md
    output:
      path: context.build_plan
    postconditions:
      - type: file_exists
        path: "docs/build-plan.md"

  - name: build-product
    type: ask_ai
    description: >
      The specialist architect builds the product following the plan —
      implements features, writes tests, generates Docker Compose
    config:
      agent: "{{context.tech_stack.agent}}"
      prompt: |
        /building-product {{input.product_name | slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read the build plan:
        - docs/build-plan.md

        Read all product definition documents:
        - docs/product-definition/3-mvp-brief.md
        - docs/product-definition/4-design-specification.md
        - docs/product-definition/5-visual-specification.md
        - docs/product-definition/6-content-specification.md
        - docs/product-definition/7-architecture-blueprint.md

        Execute the build plan. Build real software with proper engineering:
        - Implement features from the MVP Brief scope
        - Apply the Design Spec (all states, not just happy path)
        - Apply the Visual Spec (theme, colors, components)
        - Apply the Content Spec (actual copy, labels, messages)
        - Follow the Architecture Blueprint (domain model, patterns)
        - Write tests for everything
        - Generate docker-compose.yml with only the app port exposed
        - Commit incrementally to git

        ## Output

        Working software in the product's git repo
    output:
      path: context.build

  - name: verify-build
    type: ask_ai
    description: >
      The Tech Smith verifies the build against the MVP Brief scope
      and flags gaps
    config:
      agent: tech-smith
      prompt: |
        /verifying-product-build {{input.product_name | slug}}

        Product name: {{input.product_name}}

        Read the MVP Brief and build plan:
        - docs/product-definition/3-mvp-brief.md
        - docs/product-definition/4-design-specification.md
        - docs/build-plan.md

        Verify the build:
        1. Run the test suite
        2. Check every scope item in the MVP Brief has an implementation
        3. Check Docker Compose is valid
        4. Flag gaps and quality issues

        Append verification results to docs/build-plan.md.

        ## Output

        Updated docs/build-plan.md with verification results
    output:
      path: context.verification

  - name: deploy-local
    type: run_script
    description: >
      In dev mode: run Docker Compose to provide a working demo URL.
      In prod mode: skip (code was already pushed by the build step).
    config:
      module: FlowStudio.Workflows.Scripts.ProductDeploy
      function: deploy_local

  - name: push-to-remote
    type: run_script
    description: >
      Commit any remaining changes and push to the remote repository
    config:
      module: FlowStudio.Workflows.Scripts.CreateProduct
      function: commit_and_push_definition
