name: create-mvp-brief
description: >
  Creates the MVP Brief through structured analysis: analyze research,
  explore options, make the bet. Produces the foundational document that
  all other product definition documents build on.
version: "1.0.0"

input:
  product_name:
    type: string
    required: true
    description: Human-readable name of the product
  instruction:
    type: string
    required: false
    description: >
      Optional user instruction passed to every step. Use for focus areas,
      constraints, preferences, or feedback from a previous iteration.
      Examples: "Focus on solo founders first", "Explore usage-based pricing",
      "The previous brief was too broad — narrow the segment"

steps:

  - name: analyze-research
    type: ask_ai
    description: >
      The Product Team analyzes your research to surface key findings,
      tensions, and the decisions that need to be made
    config:
      agent: product-maestro
      prompt: |
        /synthesizing-product-research {{input.product_name | slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read all documents in docs/product-brief/ and synthesize them into a
        focused working document. Apply all four lenses: product, design,
        business, and engineering.

        ## Output

        Save to: docs/product-definition/working/research-synthesis.md
    output:
      path: context.research_synthesis
    postconditions:
      - type: file_exists
        path: "docs/product-definition/working/research-synthesis.md"

  - name: explore-mvp-options
    type: ask_ai
    description: >
      The Product Team explores 2-3 viable options — different combinations
      of who to build for, what to charge, and what to include
    config:
      agent: product-maestro
      prompt: |
        /exploring-mvp-options {{input.product_name | slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read the research synthesis at
        docs/product-definition/working/research-synthesis.md and explore
        2-3 viable MVP options. Each option must be a coherent package:
        segment + business model + scope + experience model.

        Apply the Four-Question Architecture to each option.
        Include a First Moment sketch, unit economics sketch, and
        MVP Scope Test for each.

        ## Output

        Save to: docs/product-definition/working/mvp-options.md
    output:
      path: context.mvp_options
    postconditions:
      - type: file_exists
        path: "docs/product-definition/working/mvp-options.md"

  - name: draft-mvp-brief
    type: ask_ai
    description: >
      The Product Team makes the bet — choosing the primary option and
      documenting it as your MVP Brief
    config:
      agent: product-maestro
      prompt: |
        /writing-mvp-brief {{input.product_name | slug}}

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read the research synthesis and options analysis:
        - docs/product-definition/working/research-synthesis.md
        - docs/product-definition/working/mvp-options.md

        If a product context file exists (.claude/context/product-context.md),
        read it to understand what the product already has. Existing
        capabilities should be included by default — they have zero
        incremental build cost.

        Choose the primary option (or a coherent hybrid), sharpen the scope,
        state the hypotheses, define the revenue signal, and write the
        MVP Brief.

        If user instruction indicates a preference for a specific option
        or segment, weight it heavily — the founder's judgment matters.

        ## Output

        Save to: docs/product-definition/1-mvp-brief.md
    output:
      path: context.mvp_brief
    postconditions:
      - type: file_exists
        path: "docs/product-definition/1-mvp-brief.md"
