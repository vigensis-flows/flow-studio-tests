name: assess-mvp-readiness
description: >
  Assesses whether a product is ready for production. Three expert perspectives
  (Product, Technical, Experience) produce a single readiness report with a
  clear Go/No-Go signal. Re-runnable — each run replaces the previous report.
version: "1.0.0"

input:
  product_name:
    type: string
    required: true
    description: Human-readable name of the product
  instruction:
    type: string
    required: false
    description: >
      Optional focus areas for the assessment.
      Examples: "We're worried about security", "Focus on the onboarding experience"

steps:

  - name: assess-product-readiness
    type: ask_ai
    description: >
      The Product Maestro assesses whether the build implements the MVP Brief
      scope, whether hypotheses are testable, and whether the revenue mechanism
      is present
    config:
      agent: product-maestro
      prompt: |
        You are assessing MVP readiness from a product perspective.

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read the MVP Brief and inspect the built product:
        - docs/product-definition/3-mvp-brief.md
        - docs/product-definition/2-product-strategy.md

        Then explore the codebase to understand what was actually built.

        Create the readiness report with this structure:

        ```markdown
        # MVP Readiness Assessment: {{input.product_name}}

        ## Signal: [READY | NOT READY | READY WITH CONDITIONS]
        <!-- Blockers: [count if not ready] -->

        ---

        ## Product Readiness

        ### Scope Coverage
        | MVP Brief Item | Status | Evidence |
        |----------------|--------|----------|
        | [item] | Implemented / Partial / Missing | [file or feature] |

        ### Hypothesis Testability
        [Can each hypothesis from the MVP Brief actually be tested with this build?]

        ### Revenue Mechanism
        [Is the revenue mechanism (or behavioral proxy) present?]

        ### Product Readiness Signal: [READY | NOT READY]
        [Summary + blockers if any]
        ```

        IMPORTANT: Set the top-level Signal to NOT READY for now — the other
        assessments haven't run yet. The synthesis step will set the final signal.

        ## Output

        Save to: docs/reviews/mvp-readiness.md
    output:
      path: context.product_readiness
    postconditions:
      - type: file_exists
        path: "docs/reviews/mvp-readiness.md"

  - name: assess-technical-readiness
    type: ask_ai
    description: >
      The Tech Smith assesses code quality, test coverage, security basics,
      deployment readiness, and operations basics
    config:
      agent: tech-smith
      prompt: |
        You are assessing MVP readiness from a technical perspective.

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read the existing readiness report:
        - docs/reviews/mvp-readiness.md

        Read the architecture blueprint:
        - docs/product-definition/7-architecture-blueprint.md

        Then inspect the codebase thoroughly:
        - Run the test suite
        - Check code quality and structure
        - Look for security basics (auth, input validation, no secrets in code)
        - Check deployment readiness (Dockerfile, docker-compose.yml, env config)
        - Check operations basics (logging, error handling)
        - Quick license compliance scan of dependencies

        APPEND to docs/reviews/mvp-readiness.md (do NOT overwrite existing content):

        ```markdown
        ---

        ## Technical Readiness

        ### Test Results
        [Test count, pass/fail, coverage if available]

        ### Code Quality
        [Structure, patterns, cleanliness — specific observations]

        ### Security Basics
        - [ ] Authentication works
        - [ ] Input validation present
        - [ ] No secrets in code
        - [ ] HTTPS configured
        [Notes on each]

        ### Deployment Readiness
        - [ ] Docker Compose works
        - [ ] Environment variables configured
        - [ ] Database migrations run cleanly
        [Notes]

        ### Operations Basics
        - [ ] Logging present
        - [ ] Error handling covers failure cases
        - [ ] Health check endpoint exists
        [Notes]

        ### Technical Readiness Signal: [READY | NOT READY]
        [Summary + blockers if any]
        ```

        ## Output

        Updated docs/reviews/mvp-readiness.md with Technical Readiness section appended
    output:
      path: context.technical_readiness

  - name: assess-experience-readiness
    type: ask_ai
    description: >
      The Design Shaper assesses the First Moment test, core flow completion,
      state coverage, and accessibility basics
    config:
      agent: design-shaper
      prompt: |
        You are assessing MVP readiness from a user experience perspective.

        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        Read the existing readiness report:
        - docs/reviews/mvp-readiness.md

        Read the design specification:
        - docs/product-definition/4-design-specification.md
        - docs/product-definition/5-visual-specification.md
        - docs/product-definition/6-content-specification.md

        Then inspect the built product's UI code:
        - Can a new user figure out what to do? (First Moment test)
        - Do the core flows work end-to-end?
        - Are all defined states implemented (empty, loading, error, success)?
        - Are accessibility basics covered (keyboard nav, contrast, labels)?

        APPEND to docs/reviews/mvp-readiness.md (do NOT overwrite existing content):

        ```markdown
        ---

        ## Experience Readiness

        ### First Moment Test
        [Can a new user figure out what to do in 30 seconds?]

        ### Core Flow Completion
        | Flow | Status | Notes |
        |------|--------|-------|
        | [flow from Design Spec] | Complete / Partial / Missing | [details] |

        ### State Coverage
        [Are empty, loading, error, and success states implemented for key screens?]

        ### Accessibility Basics
        - [ ] Keyboard navigation works
        - [ ] Sufficient color contrast
        - [ ] Form labels present
        - [ ] Screen reader basics
        [Notes]

        ### Experience Readiness Signal: [READY | NOT READY]
        [Summary + blockers if any]
        ```

        ## Output

        Updated docs/reviews/mvp-readiness.md with Experience Readiness section appended
    output:
      path: context.experience_readiness

  - name: synthesize-go-no-go
    type: ask_ai
    description: >
      The Product Maestro synthesizes all three assessments into a final
      Go/No-Go signal with ranked blockers
    config:
      agent: product-maestro
      prompt: |
        You are producing the final Go/No-Go synthesis for MVP readiness.

        Product name: {{input.product_name}}

        Read the complete readiness report:
        - docs/reviews/mvp-readiness.md

        It now contains three sections: Product Readiness, Technical Readiness,
        and Experience Readiness. Each has its own signal.

        APPEND a synthesis section AND update the top-level Signal:

        ```markdown
        ---

        ## Go/No-Go Synthesis

        ### Assessment Summary
        | Dimension | Signal | Critical Blockers |
        |-----------|--------|-------------------|
        | Product | [READY/NOT READY] | [count] |
        | Technical | [READY/NOT READY] | [count] |
        | Experience | [READY/NOT READY] | [count] |

        ### Blockers (Ranked by Severity)
        1. [Most critical blocker — what and why]
        2. [Second blocker]
        ...

        ### Conditions (if READY WITH CONDITIONS)
        [What must be true before going live, even if technically ready]

        ### Final Signal: [READY | NOT READY | READY WITH CONDITIONS]
        [Clear, honest assessment. What needs to happen next.]
        ```

        ALSO: Update the `## Signal:` line at the TOP of the document to match
        the final signal. Include the blocker count if not ready:
        `## Signal: NOT READY (X blockers)` or `## Signal: READY`

        ## Output

        Updated docs/reviews/mvp-readiness.md with synthesis and corrected top-level signal
    output:
      path: context.synthesis

  - name: save-readiness-report
    type: run_script
    description: Commit and push the readiness report
    config:
      module: FlowStudio.Workflows.Scripts.CreateProduct
      function: commit_and_push_definition
