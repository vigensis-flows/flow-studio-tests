name: create-brand-foundation
description: >
  Brand strategist creates the Minimum Viable Brand foundation — name validation,
  messaging framework, visual identity direction, and brand narrative based on
  the product definition.
version: "1.0.0"

input:
  product_name:
    type: string
    required: true
    description: Human-readable name of the product
  instruction:
    type: string
    required: false
    description: Optional guidance for the review

steps:
  - name: brand-foundation
    type: ask_ai
    description: Create the brand foundation for the product
    config:
      agent: brand-strategist
      prompt: |
        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        ## Task

        Create the Minimum Viable Brand foundation for this product.

        Read these documents:
        - docs/product-definition/1-mvp-brief.md
        - docs/product-definition/2-product-vision.md
        - docs/product-definition/3-product-strategy.md
        - docs/product-definition/6-content-specification.md

        Develop:
        - Name validation/suggestions
        - Tagline options
        - Messaging framework
        - Logo direction
        - Brand narrative
        - Visual identity direction

        For each element, provide rationale and alternatives where appropriate.

        ## Iteration Awareness

        Check if docs/reviews/brand-foundation.md already exists.
        If it does, read it first and refine based on the user instruction.
        Preserve what's still valid, update what needs to change.
        Note revisions in a "## Revision Notes" section at the end.

        ## Output

        Save to: docs/reviews/brand-foundation.md
    output:
      path: context.review
    postconditions:
      - type: file_exists
        path: "docs/reviews/brand-foundation.md"
