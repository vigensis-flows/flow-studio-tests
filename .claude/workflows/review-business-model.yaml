name: review-business-model
description: >
  Business expert reviews the product definition for economic viability,
  pricing strategy, and business model risks. Produces a business model
  assessment with validation findings and recommendations.
version: "1.0.0"

input:
  product_name:
    type: string
    required: true
    description: Human-readable name of the product
  instruction:
    type: string
    required: false
    description: Optional guidance for the review

steps:
  - name: business-model-review
    type: ask_ai
    description: Conduct business model review of the product definition
    config:
      agent: business-architect
      prompt: |
        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        ## Task

        Conduct a business model review of this product's definition.

        Read these documents:
        - docs/product-definition/1-mvp-brief.md
        - docs/product-definition/3-product-strategy.md

        Assess:
        - Unit economics validation
        - Pricing model assessment
        - Revenue model viability
        - CAC/LTV analysis
        - Market sizing reality check
        - Business model risks

        For each finding, provide:
        - Risk rating (Critical / High / Medium / Low)
        - Description of the risk or opportunity
        - Recommendation to address it

        ## Iteration Awareness

        Check if docs/concept-validation/business-model-review.md already exists.
        If it does, read it first and refine based on the user instruction.
        Preserve what's still valid, update what needs to change.
        Note revisions in a "## Revision Notes" section at the end.

        ## Output

        Save to: docs/concept-validation/business-model-review.md
    output:
      path: context.review
    postconditions:
      - type: file_exists
        path: "docs/concept-validation/business-model-review.md"
