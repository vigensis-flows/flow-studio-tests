name: prepare-product-brief-with-materials
description: Extract the content from the provided materials and draft the Product Brief
version: "2.0.0"
navigate_to: product-brief

input:
  product_name:
    type: string
    required: true
    description: Name of the product
  description:
    type: string
    required: false
    description: Short description of the product idea

display:
  label: "{{input.product_name}}"
  sections:
    - header: "Product Brief"
      content: output.summary
      
steps:
  - name: digest-materials
    type: ask_ai
    description: VIA processes the provided materials and creates a structured digest
    config:
      agent: research-analyst
      prompt: |
        /processing-provided-materials {{input.product_name}}

        **Product:** {{input.product_name}}
        **Materials folder:** docs/product-brief/materials
        **Save digest to:** docs/product-brief/provided-materials-digest.md
    output:
      path: context.digest
    postconditions:
      - type: file_exists
        path: "docs/product-brief/provided-materials-digest.md"

  - name: draft-product-brief
    type: run_workflow
    description: Then we draft the initial product brief
    config:
      workflow: draft-product-brief
      input:
        product_name: "{{input.product_name}}"
        description: "{{input.description}}"
      inherit_context: true
