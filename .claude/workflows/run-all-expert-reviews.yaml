name: run-all-expert-reviews
description: >
  Runs all 7 expert reviews sequentially. Each review produces one document
  in docs/reviews/. Sequential execution manages system load — only
  one AI agent runs at a time.
version: "1.0.0"

input:
  product_name:
    type: string
    required: true
    description: Human-readable name of the product
  instruction:
    type: string
    required: false
    description: >
      Optional user instruction passed to every review.
      Examples: "Focus on EU market compliance", "Pay attention to data handling"

steps:

  - name: security-review
    type: run-workflow
    description: Security expert reviews threat model, auth, and data risks
    config:
      workflow: review-security
      input:
        product_name: "{{input.product_name}}"
        instruction: "{{input.instruction}}"
      inherit_context: true

  - name: privacy-review
    type: run-workflow
    description: Privacy expert reviews GDPR/CCPA compliance and data handling
    config:
      workflow: review-privacy
      input:
        product_name: "{{input.product_name}}"
        instruction: "{{input.instruction}}"
      inherit_context: true

  - name: business-model-review
    type: run-workflow
    description: Business architect reviews unit economics and revenue model
    config:
      workflow: review-business-model
      input:
        product_name: "{{input.product_name}}"
        instruction: "{{input.instruction}}"
      inherit_context: true

  - name: license-audit
    type: run-workflow
    description: License expert reviews dependency compatibility
    config:
      workflow: audit-licenses
      input:
        product_name: "{{input.product_name}}"
        instruction: "{{input.instruction}}"
      inherit_context: true

  - name: brand-foundation
    type: run-workflow
    description: Brand strategist creates naming and messaging framework
    config:
      workflow: create-brand-foundation
      input:
        product_name: "{{input.product_name}}"
        instruction: "{{input.instruction}}"
      inherit_context: true

  - name: investor-pitch
    type: run-workflow
    description: Strategy expert creates investor pitch deck
    config:
      workflow: create-investor-pitch
      input:
        product_name: "{{input.product_name}}"
        instruction: "{{input.instruction}}"
      inherit_context: true

  - name: customer-pitch
    type: run-workflow
    description: Brand strategist creates customer pitch deck
    config:
      workflow: create-customer-pitch
      input:
        product_name: "{{input.product_name}}"
        instruction: "{{input.instruction}}"
      inherit_context: true
