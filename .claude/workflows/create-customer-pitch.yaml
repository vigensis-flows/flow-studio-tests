name: create-customer-pitch
description: >
  Brand strategist creates early customer pitch content — a compelling
  problem/solution/value narrative for acquiring first customers, with
  pain point framing, benefits, and differentiation.
version: "1.0.0"

input:
  product_name:
    type: string
    required: true
    description: Human-readable name of the product
  instruction:
    type: string
    required: false
    description: Optional guidance for the review

steps:
  - name: customer-pitch
    type: ask_ai
    description: Create early customer pitch content
    config:
      agent: brand-strategist
      prompt: |
        Product name: {{input.product_name}}
        User instruction: {{input.instruction}}

        ## Task

        Create a compelling pitch for early customers of this product.

        Read these documents:
        - docs/product-definition/1-mvp-brief.md
        - docs/product-definition/2-product-vision.md
        - docs/product-definition/3-product-strategy.md

        Also read docs/concept-validation/brand-foundation.md if it exists,
        to align messaging with the brand foundation.

        Develop:
        - Pain point framing
        - Solution overview
        - Key benefits (3-5)
        - Differentiation from alternatives
        - Social proof placeholders
        - Call to action

        Write for the target customer persona identified in the strategy.
        Focus on emotional resonance and concrete value, not features.

        ## Iteration Awareness

        Check if docs/concept-validation/customer-pitch.md already exists.
        If it does, read it first and refine based on the user instruction.
        Preserve what's still valid, update what needs to change.
        Note revisions in a "## Revision Notes" section at the end.

        ## Output

        Save to: docs/concept-validation/customer-pitch.md
    output:
      path: context.review
    postconditions:
      - type: file_exists
        path: "docs/concept-validation/customer-pitch.md"
