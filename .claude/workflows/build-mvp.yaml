# DEPRECATED: This monolithic workflow has been decomposed into:
#   - product-discovery.yaml (Phase 2: Product Definition)
#   - Concept validation workflows: review-security, review-privacy, review-business-model,
#     audit-licenses, create-brand-foundation, create-investor-pitch, create-customer-pitch
#   - plan-and-build.yaml (Phase 4: MVP Build)
# See docs/product/product-lifecycle.md for the new product lifecycle.
# This file is kept for reference only. Do not use for new products.
#
name: build-mvp
description: Orchestrates the complete MVP build from input to working product
version: "1.0.0"

input:
  product_slug:
    type: string
    required: true
    description: URL-friendly identifier for the product
  product_name:
    type: string
    required: true
    description: Human-readable name of the product
  instruction:
    type: string
    required: false
    description: Optional user instruction (tech stack, priorities, constraints)

steps:
  # Phase 1: Prepare — review input, fill gaps, determine tech stack
  - name: prepare
    type: run_workflow
    description: Review and enrich product input files
    config:
      workflow: prepare-input
      input:
        product_slug: "{{input.product_slug}}"
        product_name: "{{input.product_name}}"
        instruction: "{{input.instruction}}"
      inherit_context: true
    output:
      path: context.prepare
    postconditions:
      - type: file_exists
        path: "docs/products/{{input.product_slug}}/input-review.md"

  # Phase 2: Discover & Define — MVP brief, hypotheses, vision, design, architecture
  - name: discover-and-define
    type: run_workflow
    description: Conduct discovery and create all product definition documents
    config:
      workflow: discover-and-define
      input:
        product_slug: "{{input.product_slug}}"
        product_name: "{{input.product_name}}"
        instruction: "{{input.instruction}}"
      inherit_context: true
    output:
      path: context.discovery
    postconditions:
      - type: file_exists
        path: "docs/products/{{input.product_slug}}/mvp-brief.md"
      - type: file_exists
        path: "docs/products/{{input.product_slug}}/vision.md"
      - type: file_exists
        path: "docs/products/{{input.product_slug}}/design-spec.md"
      - type: file_exists
        path: "docs/products/{{input.product_slug}}/architecture.md"

  # Phase 3: Plan & Build — create increment, build, assess, improve
  - name: plan-and-build
    type: run_workflow
    description: Plan the increment, build the MVP, assess, and improve
    config:
      workflow: plan-and-build
      input:
        product_slug: "{{input.product_slug}}"
        product_name: "{{input.product_name}}"
        instruction: "{{input.instruction}}"
      inherit_context: true
    output:
      path: context.build
