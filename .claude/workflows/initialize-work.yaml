name: initialize-work
description: VIA initializes a newly uploaded work with metadata, deep dive, overview, and domain relevance notes
version: "1.0.0"

input:
  work_id:
    type: string
    required: true
  work_title:
    type: string
    required: true
    description: The title of the work
  work_slug:
    type: string
    required: true
    description: The slug identifier for the work

display:
  label: "{{input.work_title}}"

navigate_to: ""

on_complete:
  event: FlowStudio.Expertise.Events.WorkInitialized
  payload:
    work_id: "{{input.work_id}}"
    work_slug: "{{input.work_slug}}"
    work_title: "{{input.work_title}}"

on_failure:
  event: FlowStudio.Expertise.Events.WorkInitializationFailed
  payload:
    work_id: "{{input.work_id}}"
    error: "{{error.message}}"

steps:
  - name: extract-metadata
    type: run_script
    description: Extract authors, publication year, and generate one-line summary from front matter
    config:
      module: FlowStudio.Workflows.Scripts.WorkMetadataExtractor
      function: extract_metadata
    output:
      path: context.metadata
    postconditions:
      - type: record_field_not_null
        resource: FlowStudio.Expertise.Work
        id: "{{input.work_id}}"
        field: summary
        message: "Work must have a summary after metadata extraction"

  - name: create-deep-dive
    type: ask_ai
    description: Intelligence Architect creates a comprehensive deep dive analysis
    config:
      agent: intelligence-architect
      model: sonnet
      prompt: |
        /creating-work-deep-dives {{input.work_slug}}
    output:
      path: context.deep_dive_thinking

  - name: create-overview
    type: ask_ai
    description: Intelligence Architect creates the overview (derived from deep dive)
    config:
      agent: intelligence-architect
      model: sonnet
      prompt: |
        /creating-work-overviews {{input.work_slug}}
    output:
      path: context.overview_thinking

  - name: retrieve-linked-domains
    type: run_script
    description: Query all domains linked to this work for relevance note generation
    config:
      module: FlowStudio.Workflows.Scripts.WorkLinkedDomains
      function: retrieve
    output:
      path: context.linked_domains
      type: array

  - name: create-relevance-notes
    type: for_each
    description: Generate a domain-specific relevance note for each linked domain
    config:
      over: context.linked_domains
      as: domain
      parallel: false
      on_error: skip
      do:
        type: ask_ai
        config:
          agent: intelligence-architect
          model: sonnet
          prompt: |
            You are helping curate the {{domain.name}} domain library.

            A work has been added: "{{input.work_title}}"
            Summary: {{context.metadata.summary}}

            Read the domain guide at {{domain.guide_path}} to understand the domain's scope and key concepts.

            Write a 1-2 sentence relevance note explaining why this work matters for the {{domain.name}} domain specifically.
            Focus on which concepts, frameworks, or practices from this work are most relevant to this domain's concerns.

            Then update the relevance note in the system. Use Tidewave to execute:

            ```elixir
            FlowStudio.Expertise.DomainWork
            |> Ash.get!("{{domain.domain_work_id}}", actor: Platform.Identity.system_actor())
            |> Ash.Changeset.for_update(:update, %{relevance_note: "<your note>"}, actor: Platform.Identity.system_actor())
            |> Ash.update!()
            ```

            Replace `<your note>` with the relevance note you wrote.
